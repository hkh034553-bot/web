# CodeRabbit AI code review configuration
# Docs: https://docs.coderabbit.ai/configuration

language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "src/**/*.tsx"
      instructions: |
        Review with focus on:
        - Tailwind utility correctness and accessibility (aria labels, focus states).
        - Animation performance (transform/opacity only, no layout thrash).
        - Client component boundaries: no server-only imports in "use client" files.
    - path: "supabase/functions/**"
      instructions: |
        Review Edge Functions for:
        - Secret handling: never log or expose service role keys or Resend API keys.
        - Input validation before sending emails (email format checks).
        - Idempotency: re-running must not double-send emails.
  ignore_paths:
    - "out/**"
    - "public/portfolio-hkh.pdf"
chat:
  auto_reply: true
